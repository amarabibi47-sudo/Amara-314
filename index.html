<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Assignment</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body{
            background: linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .card{
            width:420px;
            background:white;
            border-radius:20px;
            padding:40px;
            text-align:center;
            box-shadow:0 20px 40px rgba(0,0,0,.3);
            animation: fadeIn 1.2s;
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(30px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        .logo{
            width:90px;
            height:90px;
            border-radius:50%;
            background:#2563eb;
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            margin:auto;
            font-size:40px;
            font-weight:bold;
            box-shadow:0 10px 20px rgba(37,99,235,.4);
        }

        h1{
            color:#0f172a;
            margin-top:20px;
            margin-bottom:10px;
        }

        h3{
            color:#2563eb;
            margin-bottom:25px;
        }

        .info{
            background:#f1f5f9;
            padding:15px;
            border-radius:12px;
            margin:15px 0;
            text-align:left;
        }

        .info span{
            font-weight:bold;
            color:#1e40af;
        }

        .footer{
            margin-top:25px;
            color:#64748b;
            font-size:14px;
        }

        button{
            margin-top:20px;
            padding:12px 28px;
            border:none;
            background:#2563eb;
            color:white;
            border-radius:30px;
            font-size:16px;
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
            background:#1d4ed8;
            transform:scale(1.05);
        }
    </style>

</head>

<body>

<div class="card">

    <div class="logo">A</div>

    <h1>DevOps Assignment</h1>

    <h3>Cloud Computing - Final Term</h3>

    <div class="info">
        <p><span>👩 Student Name:</span> Amara Bibi</p>
    </div>

    <div class="info">
        <p><span>🆔 Registration No:</span> NUM-BSCS-2023-14</p>
    </div>

    <div class="info">
        <p><span>🏫 University:</span> NAMAL University</p>
    </div>

    <div class="info">
        <p><span>📚 Course:</span> CS-350 Cloud Computing</p>
    </div>

    <button onclick="showMessage()">Welcome</button>

    <div class="footer">
        © 2026 | DevOps Workshop Assignment
    </div>

</div>
<footer style="margin-top:30px; color:#666;">
    Powered by Docker & Azure 🚀
</footer>

<script>
function showMessage(){
    alert("Welcome Amara Bibi!\nDevOps Assignment Successfully Running.");
}
</script>

</body>
</html>
